name: "Label PRs"

on:
  - pull_request_target

jobs:
  label-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Banana
        run: |
          echo ${{ secrets.WAHOO }}
      - uses: actions/labeler@v6
        with:
          sync-labels: true